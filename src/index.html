
<title>Planning Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: menu lateral branco (guias agrupadas) | à direita, cabeçalho com indicadores em pílulas, comandos em cartões e o conteúdo em cartões brancos sobre fundo cinza-claro.
   Visual claro e suave: azul como cor principal, amarelo como destaque; vermelho só para erro/excluir, verde só para adicionar. */
:root{
  color-scheme:light;
  --fundo:#edf0f5; --card:#ffffff; --tinta:#1f2a3a; --cinza:#7b8799; --borda:#e1e6ee; --linha:#edf0f5;
  --azul:#1769e8; --azul-2:#3d8ef5; --azul-s:#e7f0fd; --azul-t:#0f4fb3; --amarelo:#f2b400; --amarelo-s:#fff4d1;
  --grupo:#dbe8fb; --grupo-fg:#0f4fb3; --ativ:#f1f6fe; --ativ-fg:#1769e8; --conc:#f5f7fa; --conc-fg:#4a5668;
  --tot:#1769e8; --tot-fg:#ffffff; --calc:#f3f7fd; --calc-fg:#26456f;
  --rosa:#fde9e8; --rosa-fg:#c8322b; --verde:#e2f5eb; --verde-fg:#1b7f4c;
  --sh:6px 6px 18px rgba(150,166,190,.34),-6px -6px 16px rgba(255,255,255,.9);
  --sh-p:3px 3px 8px rgba(150,166,190,.30),-3px -3px 8px rgba(255,255,255,.9);
  --r:18px;
  --disp:"Poppins","Segoe UI",system-ui,sans-serif; --ui:"Nunito Sans","Segoe UI",system-ui,sans-serif; --mono:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fundo:#0f141c; --card:#19212c; --tinta:#e4e9f1; --cinza:#93a0b4; --borda:#2b3544; --linha:#232c39;
  --azul:#4d8dff; --azul-2:#6aa3ff; --azul-s:#1c2a42; --azul-t:#9cc1ff; --amarelo:#f2c14e; --amarelo-s:#3a3220;
  --grupo:#1e2f4c; --grupo-fg:#a9c7ff; --ativ:#1a2536; --ativ-fg:#8fb6ff; --conc:#1c232e; --conc-fg:#aab5c6;
  --tot:#2f6fe0; --tot-fg:#ffffff; --calc:#1b2535; --calc-fg:#b9cdee;
  --rosa:#3a1f22; --rosa-fg:#ff8a80; --verde:#15302a; --verde-fg:#6fd3a0;
  --sh:0 6px 18px rgba(0,0,0,.45); --sh-p:0 2px 8px rgba(0,0,0,.4);
}
:root[data-theme="dark"] img,:root[data-theme="dark"] .logo-keep{filter:none}
:root[data-theme="dark"] .inp tr.ip-x td{background:#2b2717}
:root[data-theme="dark"] .kpi-s.ru{background:#3a1f22;color:#ff8a80}:root[data-theme="dark"] .kpi-s.ok{background:#15302a;color:#6fd3a0}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{color:var(--tinta)}
.mp-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;margin-top:10px}
.mp-cv{position:relative;height:calc(100vh - 330px);min-height:440px;border-radius:14px;overflow:hidden;background:#141b26;border:1px solid var(--borda)}
.mp-svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}.mp-svg.arr{cursor:grabbing}
.mp-svg path:hover{stroke-width:3px;filter:brightness(1.25)}
.mp-pt text{fill:#f3f6fb;font-family:var(--ui);font-weight:600;paint-order:stroke;stroke:#141b26;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mp-ctr{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mp-ctr button{width:34px;height:34px;border:0;background:#fff;color:#1d2533;font:600 18px var(--ui);cursor:pointer;display:grid;place-items:center;border-bottom:1px solid #e3e7ee}.mp-ctr button:last-child{border-bottom:0}.mp-ctr button:hover{background:#eef3fb}
.mp-n{position:absolute;top:12px;left:14px;color:#f3f6fb;opacity:.85}
.mp-esc{position:absolute;left:14px;bottom:12px;color:#f3f6fb;font:600 11px var(--ui);display:flex;flex-direction:column;gap:3px}.mp-esc i{display:block;height:6px;border:2px solid #f3f6fb;border-top:0}
.mp-xy{position:absolute;right:12px;bottom:12px;color:#c9d3e2;font:500 11px var(--ui);font-variant-numeric:tabular-nums;background:rgba(20,27,38,.7);padding:3px 7px;border-radius:6px}.mp-xy:empty{display:none}
.mp-side{border:1px solid var(--borda);border-radius:14px;background:var(--card);padding:12px 14px;overflow:auto;max-height:calc(100vh - 330px);min-height:440px;box-sizing:border-box}
.mp-side h4{margin:4px 0 8px;font:700 11px var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--cinza)}
.mp-cams{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.mp-cam{display:grid;grid-template-columns:auto 10px 1fr auto;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer;font:500 12.5px var(--ui);color:var(--tinta)}.mp-cam:hover{background:color-mix(in srgb,var(--azul) 8%,transparent)}
.mp-cam i{width:10px;height:10px;border-radius:3px}.mp-cam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mp-cam em{font-style:normal;color:var(--cinza);font-size:11px}
.mp-op{display:flex;align-items:center;gap:10px;font:500 12px var(--ui);color:var(--cinza);padding:2px 4px 0}.mp-op input{flex:1;accent-color:var(--azul)}
.mp-inf{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0 0 14px;font:500 12px var(--ui)}.mp-inf dt{color:var(--cinza)}.mp-inf dd{margin:0;color:var(--tinta);word-break:break-word}
.mp-acs{display:flex;flex-wrap:wrap;gap:8px 14px}.mp-acs .lk{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.mp-acs .dn{color:#c9352b}
.mp-vazio{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px;gap:6px}.mp-vazio>svg{width:56px;height:56px;color:var(--cinza)}.mp-vazio h3{margin:6px 0 0}.mp-vazio p{max-width:520px;color:var(--cinza);margin:0 0 10px}
@media(max-width:860px){.mp-grid{grid-template-columns:1fr}.mp-cv{height:60vh}}
.idi-op{display:flex;gap:12px;flex-wrap:wrap}.idi-op label{display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 16px;border-radius:14px;border:2px solid var(--borda);min-width:150px;background:var(--card)}.idi-op label.on{border-color:var(--azul)}.idi-op input{position:absolute;opacity:0}.idi-op label:focus-within{outline:2px solid var(--azul);outline-offset:2px}.idi-sg{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--azul-s,#e7f0fd);color:var(--azul);font:700 11px var(--ui)}
.tema-op{display:flex;gap:12px;flex-wrap:wrap}.tema-op label{display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;padding:12px;border-radius:14px;border:2px solid var(--borda);min-width:150px;background:var(--card)}
.tema-op label.on{border-color:var(--azul)}.tema-op input{position:absolute;opacity:0}.tema-op label:focus-within{outline:2px solid var(--azul);outline-offset:2px}
.tema-pv{width:120px;height:72px;border-radius:10px;display:grid;grid-template-columns:30px 1fr;overflow:hidden;border:1px solid var(--borda)}.tema-pv i{display:block}
:root[data-theme="dark"] .marca svg,:root[data-theme="dark"] .lado-p .op svg{color:#e4e9f1}
.marca svg,.lado-p .op svg{color:#13213f}
:root[data-theme="dark"] .jan input[type=text],:root[data-theme="dark"] .jan input[type=date],:root[data-theme="dark"] .jan select,:root[data-theme="dark"] .jan textarea,:root[data-theme="dark"] .cpuf input[type=text],:root[data-theme="dark"] .cpuf select,:root[data-theme="dark"] .cpu-hm input,:root[data-theme="dark"] .cro-add input,:root[data-theme="dark"] .cf input,:root[data-theme="dark"] .cf select,:root[data-theme="dark"] .cfg table.g td.k{background:var(--fundo);color:var(--tinta)}
:root[data-theme="dark"] table.g tr.mc td{background:var(--ativ)}:root[data-theme="dark"] .gl .tr{background:var(--linha)}:root[data-theme="dark"] .ler{color:var(--tinta)}
:root[data-theme="dark"] .cfg-n button,:root[data-theme="dark"] .cf label,:root[data-theme="dark"] .chips button,:root[data-theme="dark"] .chips span{color:var(--cinza)}
:root[data-theme="dark"] .cpu-it td.cpu-lk,:root[data-theme="dark"] .bxl.in{color:#6fd3a0}:root[data-theme="dark"] .esc.g{color:#f2c14e}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font:13px/1.4 var(--ui);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
#app{display:grid;grid-template-columns:244px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"lado topo" "lado main";height:100%}
#abas{grid-area:lado}#rib{grid-area:topo}main{grid-area:main}
.rib,main,#abas{min-width:0}

/* menu lateral */
#abas{background:var(--card);border-radius:0 28px 28px 0;box-shadow:6px 0 24px rgba(150,166,190,.25);display:flex;flex-direction:column;overflow-y:auto;padding:22px 14px 18px;z-index:5}
.marca{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font:600 15px/1.15 var(--disp);color:var(--tinta)}
.marca svg{width:30px;height:39px;flex:none}
.marca small{display:block;margin-top:3px;font:500 10.5px/1 var(--ui);color:var(--cinza)}
.lado-p .op{display:flex;align-items:center;gap:7px;margin-top:8px;font:500 11px/1.25 var(--disp);color:#8b96a6}
.lado-p .op svg{width:14px;height:18px;flex:none}
#app.min .lado-p{display:none}
#abas nav{display:flex;flex-direction:column;gap:1px}
#abas h6{margin:14px 10px 4px;font:600 10.5px/1 var(--disp);letter-spacing:.09em;text-transform:uppercase;color:#a3adbb}
#abas a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;color:#8b96a6;text-decoration:none;font:500 13px/1.2 var(--disp);white-space:nowrap}
#abas a svg{width:18px;height:18px;flex:none}
#abas a.lg span{white-space:normal;line-height:1.2}
#abas a em{margin-left:auto;font:600 9.5px/1 var(--disp);font-style:normal;letter-spacing:.04em;color:#b2bbc7}
#abas a:hover{background:var(--fundo);color:var(--tinta)}
#abas a.on{background:var(--azul-s);color:var(--azul)}
#abas a.on em{color:var(--azul-2)}
.cpu-top{margin-top:18px;padding:16px 18px;background:var(--card);border-radius:20px;box-shadow:var(--sh-p)}
.cpu-top-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cpu-top-h h3{margin:0;font:700 15px/1.2 var(--disp);color:var(--tinta)}
.seg{display:inline-flex;background:var(--fundo);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font:600 12px/1 var(--disp);color:var(--cinza);cursor:pointer}
.seg button.on{background:var(--card);color:var(--azul);box-shadow:var(--sh-p)}
#abas .gp h6{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 0;padding:10px 10px;border-radius:12px;cursor:default;font:600 11.5px/1 var(--disp);letter-spacing:.08em;color:#8b96a6;outline:none}
#abas .gp h6 svg{width:13px;height:13px;flex:none;transition:transform .2s ease;opacity:.7}
#abas .gp.on h6{color:var(--azul)}
#abas .gp:hover h6,#abas .gp:focus-within h6{background:var(--fundo);color:var(--tinta)}
#abas .gp:hover h6 svg,#abas .gp:focus-within h6 svg{transform:rotate(90deg)}
#abas .gpi{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
#abas .gpi>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:1px;padding-left:6px}
#abas .gp:hover .gpi,#abas .gp:focus-within .gpi{grid-template-rows:1fr}
#app.min #abas .gpi{grid-template-rows:1fr}#app.min #abas .gpi>div{padding-left:0}
#app.min #abas .gp h6{height:1px;padding:0;margin:10px 6px;background:var(--borda);font-size:0}#app.min #abas .gp h6 svg{display:none}
.lado-p{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--cinza)}

.recolhe{position:absolute;top:28px;right:-13px;width:26px;height:26px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh-p);color:var(--cinza);cursor:pointer;display:grid;place-items:center;padding:0;z-index:6}
.recolhe:hover{color:var(--azul)}
.recolhe svg{width:15px;height:15px}
#abas{position:relative;overflow:visible}
#abas nav{overflow-y:auto;overflow-x:hidden;min-height:0;flex:0 1 auto}
#app.min{grid-template-columns:76px minmax(0,1fr)}
#app.min #abas{padding-inline:12px}
#app.min .marca{padding-inline:3px}
#app.min .marca b,#app.min #abas a span,#app.min #abas a em,#app.min .lado-p{display:none}
#app.min #abas h6{height:1px;margin:10px 6px;background:var(--borda);font-size:0}
#app.min #abas a{justify-content:center;padding:9px 0}
#app.min #abas a svg{width:20px;height:20px}

/* cabeçalho: título, projeto, indicadores e comandos */
.rib{padding:16px 22px 4px;display:flex;flex-direction:column;gap:12px}
.topo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.topo .tt{flex:1 1 260px;min-width:0}
.topo h1{margin:0;font:600 20px/1.2 var(--disp);text-wrap:balance}
.topo p{margin:2px 0 0;color:var(--cinza);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo-d{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rproj{display:flex;flex-direction:column;gap:6px;min-width:0}
.rproj select{width:300px;max-width:100%;padding:8px 12px;border:0;border-radius:12px;background:var(--card);box-shadow:var(--sh-p);font:500 12.5px var(--disp);color:var(--tinta)}
.rproj .row{display:flex;gap:6px;flex-wrap:wrap}
.quem{font:500 12px var(--disp);color:var(--cinza);display:flex;align-items:center;gap:6px}
.lk{border:1px solid var(--borda);background:var(--card);color:var(--tinta);padding:3px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;font:600 11.5px var(--ui)}
.lk:hover{border-color:var(--azul);color:var(--azul)}
.lk[disabled]{opacity:.45;cursor:default}
.chip{padding:3px 10px;border-radius:10px;background:var(--azul-s);color:var(--azul);white-space:nowrap;font:600 11.5px var(--ui)}
.chip.crit{background:var(--rosa-fg);color:#fff}.chip.warn{background:var(--amarelo);color:#3d2c00}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kp{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:linear-gradient(135deg,var(--azul-2),var(--azul));color:#fff;box-shadow:var(--sh-p);min-width:0;border:0;text-align:left;position:relative}
.kp svg{width:30px;height:30px;flex:none}
.kp span{display:block;font:500 10.5px/1.2 var(--disp);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp b{display:block;font:600 14px/1.25 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp>div{min-width:0}
.kp.am{background:linear-gradient(135deg,#ffc933,var(--amarelo));color:#3d2c00;cursor:pointer}
.kp.ok{background:var(--card);color:var(--tinta)}
.kp .bdg{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--rosa-fg);color:#fff;font:600 11px/20px var(--disp);text-align:center}
.cmds{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;margin:0 -4px}
.rb{display:flex;align-items:center;gap:8px;flex:none;padding:7px 13px 7px 9px;border:0;border-radius:13px;background:var(--card);box-shadow:var(--sh-p);cursor:pointer;color:var(--tinta);font:500 12px/1.15 var(--disp);white-space:nowrap}
.rb svg{width:22px;height:22px;flex:none}
.rb:hover{color:var(--azul);box-shadow:var(--sh-p),inset 0 0 0 1.5px var(--azul-s)}
.rb[disabled]{opacity:.42;cursor:default;box-shadow:none;background:transparent}

/* conteúdo */
main{overflow:auto;padding-block:6px 28px;padding-inline:22px;min-width:0}
.a1{font:600 11px/1.3 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a2{font:600 16px/1.3 var(--disp);color:var(--tinta);margin:2px 0 10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.a3{min-height:18px;color:var(--rosa-fg);font-weight:700;margin-bottom:4px}
.a2 input{font:500 12.5px var(--ui);padding:7px 12px;border:0;border-radius:11px;background:var(--card);box-shadow:var(--sh-p);color:var(--tinta);width:220px;max-width:100%}
.bxl{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:11px;padding:7px 14px;background:#1d7a4a;color:#fff;font:600 12px var(--disp);cursor:pointer;box-shadow:0 5px 12px rgba(29,122,74,.22)}
.bxl svg{width:16px;height:16px}
.bxl:hover{background:#176a3f}
.bxl.in{background:var(--card);color:#1d7a4a;box-shadow:var(--sh-p),inset 0 0 0 1.5px #1d7a4a}
.bxl.in:hover{background:var(--verde)}
.nota{font:12px var(--ui);color:var(--cinza);margin:10px 2px;max-width:90ch}
.tw{overflow:auto;max-height:calc(100vh - 300px);min-height:160px;border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
table.g{border-collapse:separate;border-spacing:0;font:12.5px/1.25 var(--mono)}
table.g th,table.g td{height:24px;padding:2px 8px;white-space:nowrap;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);background:var(--card);text-align:left;vertical-align:middle;font-weight:normal}
table.g thead{position:sticky;top:0;z-index:4}
table.g th{background:var(--azul);color:#fff;border-color:#3d80ec;text-align:center;font:600 11px/1.2 var(--disp);letter-spacing:.02em}
table.g th.l{text-align:left}
table.g th.sp,table.g td.sp{background:var(--card);border-color:var(--card);min-width:12px;width:12px;padding:0}
table.g .n{text-align:right}
table.g .c{text-align:center}
table.g td.k{background:var(--calc);color:var(--calc-fg);font-weight:700}
table.g tr.tt td,table.g th.tt{background:#0f57c9;color:var(--tot-fg);font-weight:700;border-color:#2b6fdc}
table.g th.pc{background:var(--azul-s);color:var(--azul);font-weight:700;border-color:var(--borda)}
table.g tr.gr td{background:var(--grupo);color:var(--grupo-fg);font-weight:700}
table.g tr.at td{background:var(--ativ);color:var(--ativ-fg);font-weight:700}
table.g tr.co td{background:var(--conc);color:var(--conc-fg);font-weight:700}
table.g tr.fm td{background:var(--fundo);height:6px;padding:0;border-color:var(--fundo)}
table.g td.ex{background:var(--rosa);color:var(--rosa-fg);cursor:pointer;text-decoration:underline}
table.g td.ad{background:var(--verde);color:var(--verde-fg);cursor:pointer;text-decoration:underline}
table.g td.vz{color:var(--cinza)}
table.g td.er{color:var(--rosa-fg);box-shadow:inset 0 0 0 1px var(--rosa-fg)}
table.g td.e{cursor:cell}
table.g td.e:hover{box-shadow:inset 0 0 0 1.5px var(--azul-2)}
table.g td.e:focus{outline:2px solid var(--azul);outline-offset:-2px}
table.g td.e input,table.g td.e select{width:100%;min-width:60px;height:20px;border:0;padding:0 2px;margin:0;background:var(--azul-s);color:var(--tinta);font:inherit;outline:0;border-radius:4px}
table.g .f1,table.g .f2{position:sticky;z-index:2}
table.g .f1{left:0}
table.g thead .f1,table.g thead .f2{z-index:5}
table.g td.b1{background:var(--azul)}table.g td.b2{background:var(--azul-2)}table.g td.b3{background:var(--amarelo)}
table.g td.x{cursor:pointer;color:var(--rosa-fg);text-align:center;width:22px;min-width:22px;padding:0}
table.g td.w{white-space:normal;min-width:260px}
.pico{color:var(--rosa-fg);font-weight:700}
.nv{display:inline-flex;gap:3px}
.nv button{width:24px;height:22px;padding:0;border:0;border-radius:7px;background:var(--card);box-shadow:var(--sh-p);color:var(--tinta);font:600 11px var(--disp);cursor:pointer}
